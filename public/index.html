<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ofero TMM System</title>
<link rel="icon" href="img/logo_nav.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="brand"><img src="img/logo_nav.png" alt="Ofero" class="logo"><span>TMM System</span></div>
  <nav id="tabs">
    <button class="tab active" data-t="dashboard">📊 Dashboard</button>
    <button class="tab" data-t="dealers">🏪 Dealer</button>
    <button class="tab" data-t="events">🎪 Event</button>
    <button class="tab" data-t="posm">📦 POSM</button>
    <button class="tab" data-t="sellout">📈 Sell-out</button>
    <button class="tab" data-t="audit">🏬 มาตรฐานร้าน</button>
    <button class="tab" data-t="users" id="usersTab" style="display:none">👤 ผู้ใช้</button>
  </nav>
  <div class="userbox" id="userbox"></div>
</header>
<main>
  <section id="dashboard" class="view"></section>
  <section id="dealers" class="view hidden"></section>
  <section id="events" class="view hidden"></section>
  <section id="posm" class="view hidden"></section>
  <section id="sellout" class="view hidden"></section>
  <section id="audit" class="view hidden"></section>
  <section id="users" class="view hidden"></section>
  <section id="staff" class="view hidden"></section>
</main>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
