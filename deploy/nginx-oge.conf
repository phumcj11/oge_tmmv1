# Nginx site for oge.k-mkt.com  ->  Node app on 127.0.0.1:4173
# Install:  copy to /etc/nginx/sites-available/oge.conf, symlink to sites-enabled, reload.
# certbot --nginx will add the HTTPS (443) block + http->https redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name oge.k-mkt.com;

    # photo/file uploads (multer limit is 15MB) — must exceed nginx's 1MB default
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
